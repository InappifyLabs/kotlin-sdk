name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check public source boundaries
        run: bash scripts/check-publication.sh

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sdk_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$sdk_version"

      - name: Verify SDK and publication
        run: |
          ./gradlew --no-daemon --stacktrace \
            :sdk:testAllStoresDebugUnitTest \
            :sdk:testMyketReleaseUnitTest \
            :sdk:testBazaarReleaseUnitTest \
            :sdk:testDirectReleaseUnitTest \
            :sdk:lintAllStoresRelease :sdk:lintMyketRelease :sdk:lintBazaarRelease :sdk:lintDirectRelease \
            :sdk:assembleRelease \
            :sdk:publishReleasePublicationToMavenLocal \
            :sdk:assembleAllStoresDebugAndroidTest

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-sdk-${{ github.ref_name }}
          path: |
            sdk/build/outputs/aar/sdk-*-release.aar
            sdk/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Verify store-specific artifacts
        run: |
          ./gradlew :sdk:generateMetadataFileForReleasePublication
          python3 tools/verify_store_artifacts.py
